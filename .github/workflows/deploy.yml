name: Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: creds
        if: ${{ secrets.GOOGLE_CLIENT_JSON != '' }}
        run: |
          mkdir -p .data
          echo "$GOOGLE_CLIENT_JSON" > .data/google_client_secret.json
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
      - name: install
        run: pnpm -r i --frozen-lockfile
      - name: build
        run: pnpm build
      - name: upload build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: Production
      url: https://bkk.js.org
    steps:
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: configure
        uses: actions/configure-pages@v5
      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 'logging'
        run: echo "Deployed at ${{ steps.deployment.outputs.page_url }}"
